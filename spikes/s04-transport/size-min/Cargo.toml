[package]
name = "size-min"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Spike S5 Q6: smallest useful iroh endpoint, for binary-size measurement"

[features]
# `full` = iroh's default feature set (metrics, portmapper, fast-apple-datapath, tls-ring).
full = ["iroh/default"]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
bytes = "1"
