[package]
name = "bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Spike S4: QUIC (iroh) vs TLS/TCP-per-channel vs QUIC-over-one-TCP, loopback + userland impairment"

[dependencies]
iroh = { version = "=1.4.1", features = ["unstable-custom-transports"] }
noq-proto = "=1.4.0"
tcp-tunnel = { path = "../tcp-tunnel" }
tokio = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = "0.2"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
socket2 = "0.6"
