# Spike S4 + S5 (P0-14). Throwaway code — never promoted to production directly.
[workspace]
resolver = "3"
members = ["tcp-tunnel", "iroh-probe", "size-min", "size-baseline", "bench"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "=1.4.1"
noq-udp = "=1.4.0"
n0-watcher = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
debug = false

# Size measurement profile: what a shipped library would use.
[profile.size]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[profile.release-strip]
inherits = "release"
strip = true
