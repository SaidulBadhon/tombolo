name: Feature request
description: Suggest a feature or a change to the plan.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Tombolo is still in planning: please check the roadmap (docs/roadmap.md) and the
        implementation plan (docs/implementation-plan.md) first — the feature may already be planned, or ruled
        out with a reason. What gets built, and when, is decided by the maintainer.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Tombolo do? Mention the Mac side, the phone side, or both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or existing tools that do this (scrcpy, KDE Connect, …).
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Which mode would it need?
      description: Standard mode uses only the app; Enhanced mode adds the developer-permission helper (see docs/architecture.md).
      options:
        - Standard mode
        - Enhanced mode
        - Either
        - Not sure
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the roadmap and the existing issues.
          required: true
